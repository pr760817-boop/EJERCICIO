<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculos CodeRider</title>
</head>
<body>
    <div class="container">
        <h1>Cálculos CodeRider</h1>

        <div class="input-group">
            <label for="numero1">Número 1:</label>
            <input type="number" id="numero1" value="10">
        </div>
        <div class="input-group">
            <label for="numero2">Número 2:</label>
            <input type="number" id="numero2" value="5">
        </div>

        <!-- Este campo es necesario para ejercicios de listas de números -->
        <div class="input-group">
            <label for="inputGeneral">Input para Arrays (espaciado):</label>
            <input type="text" id="inputGeneral" value="1 2 3 4 5">
        </div>

        <div class="input-group">
            <label for="operacion">Operación:</label>
            <select id="operacion">
                <option value="ejercicio1">ejercicio1</option>
                <option value="ejercicio2">ejercicio2</option>
                <option value="ejercicio3">ejercicio3</option>
                <option value="ejercicio4">ejercicio4</option>
                <option value="ejercicio5">ejercicio5</option>
                <option value="contador">contador regresivo ejercicio 6 😋</option>
                <option value="sumaPar">suma de numeros pares ejercicio 7 😎</option>
                <option value="impares">numeros impares ejercicio 8 😊</option>
                <option value="potencia">potencia ejercicio 9 😉</option>
                <option value="secuencia">secuencia ejercicio 10 🤗</option>
                
                <!-- Corregidos de 'ejercicioX' a 'exX' para coincidir con main.js -->
                <option value="ex11">Ejercicio 11</option>
                <option value="ex12">Ejercicio 12</option>
                <option value="ex13">Ejercicio 13</option>
                <option value="ex14">Ejercicio 14</option>
                <option value="ex15">Ejercicio 15</option>
                <option value="ex16">Ejercicio 16</option>
                <option value="ex17">Ejercicio 17</option>
                <option value="ex18">Ejercicio 18</option>
                <option value="ex19">Ejercicio 19</option>
                <option value="ex20">Ejercicio 20</option>
                <option value="ex21">Ejercicio 21</option>
                <option value="ex22">Ejercicio 22</option>
                <option value="ex23">Ejercicio 23</option>
                <option value="ex24">Ejercicio 24</option>
                <option value="ex25">Ejercicio 25</option>
                <option value="ex26">Ejercicio 26</option> 
                <option value="ex27">Ejercicio 27</option>
                <option value="ex28">Ejercicio 28</option>
                <option value="ex29">Ejercicio 29</option>
                <option value="ex30">Ejercicio 30</option>
            </select>
        </div>

        <button id="btncalcular">Calcular 🚀</button>

        <div id="resultados">
            El resultado aparecerá aquí...
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
