<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculos CodeRider</title>
</head>
<body>
    <div class="container">
        <h1>Cálculos CodeRider</h1>

        <div class="input-group">
            <label for="numero1">Número 1:</label>
            <input type="number" id="numero1" value="10">
        </div>
        <div class="input-group">
            <label for="numero2">Número 2:</label>
            <input type="number" id="numero2" value="5">
        </div>
        <div class="input-group">
            <label for="arrayInput">Vector/array:</label>
            <input type="text" id="arrayInput" value="1,2,3,4,5">
        </div>
        <div class="input-group">
            <label for="searchInput">Valor a buscar:</label>
            <input type="text" id="searchInput" value="3">
        </div>
        <div class="input-group">
            <label for="operacion">Operación:</label>
            <select id="operacion">
                <option value="ejercicio1">Ejercicio 1</option>
                <option value="ejercicio2">Ejercicio 2</option>
                <option value="ejercicio3">Ejercicio 3</option>
                <option value="ejercicio4">Ejercicio 4</option>
                <option value="ejercicio5">Ejercicio 5</option>
                <option value="contador">Ejercicio 6 (Contador regresivo)</option>
                <option value="sumaPar">Ejercicio 7 (Suma pares)</option>
                <option value="impares">Ejercicio 8 (Números impares)</option>
                <option value="potencia">Ejercicio 9 (Potencia)</option>
                <option value="secuencia">Ejercicio 10 (Secuencia)</option>
                <option value="ejercicio11">Ejercicio 11</option>
                <option value="ejercicio12">Ejercicio 12</option>
                <option value="ejercicio13">Ejercicio 13</option>
                <option value="ejercicio14">Ejercicio 14</option>
                <option value="ejercicio15">Ejercicio 15</option>
                <option value="ejercicio20">Ejercicio 20</option>
                <option value="ejercicio21">Ejercicio 21</option>
                <option value="ejercicio22">Ejercicio 22</option>
                <option value="ejercicio23">Ejercicio 23</option>
                <option value="ejercicio24">Ejercicio 24</option>
                <option value="ejercicio25">Ejercicio 25</option>
                <option value="ejercicio26">Ejercicio 26 (Subarray Máximo)</option>
                <option value="ejercicio27">Ejercicio 27 (Combinar Vectores)</option>
                <option value="ejercicio28">Ejercicio 28 (Primos)</option>
                <option value="ejercicio29">Ejercicio 29 (Matrices)</option>
                <option value="ejercicio30">Ejercicio 30 (Merge Sort)</option>
            </select>
        </div>
        <div class="input-group">
            <label for="numeroInput">Número para contador regresivo:</label>
            <input type="number" id="numeroInput" value="5">
        </div>

        <button id="btncalcular">Calcular ���</button>
        <div class="result" id="resultados">El resultado aparecerá aquí...</div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
